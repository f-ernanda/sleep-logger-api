spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=user
spring.datasource.password=password
spring.flyway.baselineOnMigrate=true
# Route unmapped paths through RestExceptionHandler instead of Spring Boot's default error
# page. Both properties are required together: without disabling static resource mapping, the
# resource handler answers unmapped paths itself before DispatcherServlet ever gets a chance to
# throw NoHandlerFoundException.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
